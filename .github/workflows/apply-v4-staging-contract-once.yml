name: Apply the v4 hosted staging contract once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/workflows/apply-v4-staging-contract-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-v4-hosted-staging-contract-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the controlled branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply bounded source updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              file = Path(path)
              text = file.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {before!r}")
              file.write_text(text.replace(before, after, 1))

          replace_once(
              "scripts/smoke-staging-postgres.mjs",
              "assert.equal(sourceMetadata.schemaVersion, 3);",
              "assert.equal(sourceMetadata.schemaVersion, 4);",
          )
          replace_once(
              "scripts/smoke-staging-postgres.mjs",
              'timeline.push("reviewed_v1_v2_v3_migrations_and_fail_closed_metadata_verified");',
              'timeline.push("reviewed_v1_v2_v3_v4_migrations_and_fail_closed_metadata_verified");',
          )
          replace_once(
              "scripts/smoke-staging-postgres.mjs",
              'schemaVersion: "metaphilosophy-human-workflow-postgres-rehearsal-v2",',
              'schemaVersion: "metaphilosophy-human-workflow-postgres-rehearsal-v3",',
          )
          replace_once(
              "scripts/smoke-staging-postgres.mjs",
              "versions: [1, 2, 3],",
              "versions: [1, 2, 3, 4],",
          )

          replace_once(
              ".github/workflows/metaphilosophy-human-workflow-staging.yml",
              "            psql \"$database_url\" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql\n",
              "            psql \"$database_url\" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql\n            psql \"$database_url\" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql\n",
          )

          verifier = Path("scripts/verify-vercel-oidc-staging-gateway.mjs")
          verifier_text = verifier.read_text()
          if verifier_text.count("zpnbshgrscbfelpychhn") != 2:
              raise SystemExit("unexpected old hosted gateway project-ref count")
          verifier_text = verifier_text.replace("zpnbshgrscbfelpychhn", "mbswhjnjvwlewdqmwwcf")
          if verifier_text.count("assert.equal(data.metadata?.schema_version, 3);") != 1:
              raise SystemExit("unexpected hosted gateway schema assertion")
          verifier_text = verifier_text.replace(
              "assert.equal(data.metadata?.schema_version, 3);",
              "assert.equal(data.metadata?.schema_version, 4);",
          )
          verifier.write_text(verifier_text)

          replace_once(
              "scripts/verify-human-workflow-staging.mjs",
              '  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql",\n];',
              '  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql",\n  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql",\n  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql",\n];',
          )
          replace_once(
              "scripts/verify-human-workflow-staging.mjs",
              '  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql",\n]) {',
              '  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql",\n  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql",\n  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql",\n]) {',
          )
          replace_once(
              "scripts/verify-human-workflow-staging.mjs",
              'assert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql"], /chain_readback/);',
              'assert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql"], /chain_readback/);\nassert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql"], /gateway_insert_events/);\nassert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql"], /service_role/);\nassert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql"], /verification_reports/);\nassert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql"], /restore_drill_load/);\nassert.match(contents["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql"], /append-only/);',
          )

          test = Path("test/hosted-staging-gateway-contract.test.mjs")
          test_text = test.read_text()
          if '"ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql"' not in test_text:
              test_text = test_text.replace(
                  '  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql",\n',
                  '  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql",\n  "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql",\n',
                  1,
              )
              test_text += '''\n\ntest("hosted verification evidence and restore drill remain isolated and append-only", () => {\n  const migration = files["ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql"];\n  assert.match(migration, /metaphilosophy_staging_verification_reports/u);\n  assert.match(migration, /metaphilosophy_staging_restore_drill_events/u);\n  assert.match(migration, /before update or delete/iu);\n  assert.match(migration, /restore_drill_load/u);\n  assert.match(migration, /restore_drill_readback/u);\n  assert.match(migration, /research_ratings_authorized = false/u);\n  assert.match(migration, /revoke all.+from anon/isu);\n  assert.match(migration, /revoke all.+from authenticated/isu);\n});\n'''
              test.write_text(test_text)
          PY

          rm .github/workflows/apply-v4-staging-contract-once.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the synchronized v4 contract
        run: |
          node --check scripts/smoke-staging-postgres.mjs
          node --check scripts/verify-human-workflow-staging.mjs
          node --check scripts/verify-vercel-oidc-staging-gateway.mjs
          node --check test/hosted-staging-gateway-contract.test.mjs
          npm run verify:staging
          node --test test/hosted-staging-gateway-contract.test.mjs
          npm test

      - name: Commit the synchronized contract and remove this workflow
        env:
          BRANCH: agent/48-critique-pilot-20260730
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Synchronize the v4 hosted staging contract"
          git push origin "HEAD:${BRANCH}"
