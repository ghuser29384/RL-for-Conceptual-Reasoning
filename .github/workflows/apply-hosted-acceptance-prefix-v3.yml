name: Apply hosted acceptance restore-prefix V3 once

on:
  push:
    branches:
      - candidate/h11-hosted-acceptance-v3-20260807
    paths:
      - ".github/apply_hosted_acceptance_prefix_v3.py"
      - ".github/workflows/apply-hosted-acceptance-prefix-v3.yml"

permissions:
  contents: write

concurrency:
  group: hosted-acceptance-prefix-v3-20260807
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      STAGING_SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metaphilosophy_source
      STAGING_RESTORE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metaphilosophy_restore

    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: candidate/h11-hosted-acceptance-v3-20260807
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Apply fail-closed restore-prefix patch
        env:
          GITHUB_REF_NAME: candidate/h11-hosted-acceptance-v3-20260807
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          source = Path(".github/apply_hosted_acceptance_prefix_v3.py")
          spec = importlib.util.spec_from_file_location("hosted_acceptance_prefix_v3", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def indent_nonblank(text: str, prefix: str) -> str:
              return "\n".join((prefix + line) if line else line for line in text.split("\n"))

          def robust_replace_once(path: str, old: str, new: str) -> None:
              text = module.read(path)
              if old in text:
                  module.write(path, text.replace(old, new, 1))
                  return
              for width in (2, 4, 6, 8):
                  prefix = " " * width
                  candidate = indent_nonblank(old, prefix)
                  if candidate in text:
                      module.write(path, text.replace(candidate, indent_nonblank(new, prefix), 1))
                      return
              raise RuntimeError(f"{path}: anchor not found: {old[:180]!r}")

          module.replace_once = robust_replace_once
          module.main()
          PY

      - name: Remove transient Python cache
        run: rm -rf .github/__pycache__

      - name: Check diff, syntax, and Edge Function types
        run: |
          git diff --check
          node --check scripts/run-hosted-staging-acceptance.mjs
          node --check test/hosted-staging-gateway-contract.test.mjs
          deno check supabase/functions/metaphilosophy-staging-acceptance/index.ts

      - name: Run focused hosted acceptance contracts
        run: node --test test/hosted-staging-gateway-contract.test.mjs test/h11-access-gate-contract.test.mjs test/h11-narrow-candidate-contract.test.mjs

      - name: Run complete repository tests
        run: npm test

      - name: Prove build boundaries
        run: |
          npm run build
          test ! -e dist/staging
          STAGING_BUILD=true npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/participant-readiness.mjs
          test -f dist/staging/participant-readiness.css

      - name: Run synthetic lifecycle and support tabletop
        run: |
          npm run smoke:server
          npm run tabletop:staging

      - name: Exercise disposable PostgreSQL persistence and restore
        run: |
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "create database metaphilosophy_source"
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "create database metaphilosophy_restore"
          for database_url in "$STAGING_SOURCE_DATABASE_URL" "$STAGING_RESTORE_DATABASE_URL"; do
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v1.sql
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql
          done
          npm run smoke:postgres
          for database_url in "$STAGING_SOURCE_DATABASE_URL" "$STAGING_RESTORE_DATABASE_URL"; do
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql
          done
          npm run verify:staging:v4

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Run rendered Chromium workflow
        run: npx playwright test --config=e2e/staging.playwright.config.mjs

      - name: Commit exact validated acceptance successor
        run: |
          test ! -e .github/apply_hosted_acceptance_prefix_v3.py
          test ! -e .github/workflows/apply-hosted-acceptance-prefix-v3.yml
          test ! -e .github/__pycache__
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add scripts/run-hosted-staging-acceptance.mjs \
            supabase/functions/metaphilosophy-staging-acceptance/index.ts \
            test/hosted-staging-gateway-contract.test.mjs \
            ops/next-steps-2026-07-23/hosted-acceptance-restore-prefix-v3-2026-08-07.md
          git add -A .github
          git commit -m "Support append-only hosted acceptance restore prefixes"
          git reset --hard HEAD
          git clean -fdx -e .staging-evidence/
          git push origin HEAD:candidate/h11-hosted-acceptance-v3-20260807
