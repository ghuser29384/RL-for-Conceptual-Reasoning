name: Apply Metaphilosophy staging participant-readiness UX once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/workflows/apply-staging-ux-readiness-v1.yml"

permissions:
  contents: write

concurrency:
  group: apply-staging-ux-readiness-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled branch without a marketplace action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: agent/48-critique-pilot-20260730
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/ghuser29384/RL-for-Conceptual-Reasoning.git"
          git fetch --no-tags origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply fail-closed UX patch
        run: python .github/apply_staging_ux_readiness_v1.py

      - name: Validate syntax and repository contracts
        shell: bash
        run: |
          python -m py_compile .github/apply_staging_ux_readiness_v1.py
          node --check staging/app.mjs
          node --check e2e/human-workflow-staging.spec.mjs
          npm ci
          npm run verify:staging
          node --test test/human-workflow-staging-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs
          npm test
          npm run build
          test ! -e dist/staging
          STAGING_BUILD=true npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/styles.css
          git diff --check

      - name: Commit only the product and visual-evidence changes
        shell: bash
        env:
          BRANCH: agent/48-critique-pilot-20260730
        run: |
          rm .github/workflows/apply-staging-ux-readiness-v1.yml
          rm .github/apply_staging_ux_readiness_v1.py
          git add -A
          git diff --cached --check
          git commit -m "Improve staging participant readiness and submission safety"
          git push origin "HEAD:${BRANCH}"
