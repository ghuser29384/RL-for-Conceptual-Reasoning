name: Verify PR 17 cost-control backport once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - .github/workflows/verify-pr17-cost-controls-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verify-pr17-cost-controls-once
  cancel-in-progress: false

env:
  CONTROLLER_PATH: .github/workflows/verify-pr17-cost-controls-once.yml

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Guard exact repository and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ghuser29384/RL-for-Conceptual-Reasoning'
          test "$GITHUB_REF" = 'refs/heads/agent/48-critique-pilot-20260730'
          test "$GITHUB_ACTOR" = 'ghuser29384'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD | sed '/^$/d')"
          test "$changed" = "$CONTROLLER_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository checks
        id: checks
        continue-on-error: true
        run: npm run check

      - name: Run focused Vercel cost-control contracts
        id: focused
        continue-on-error: true
        run: node --test test/vercel-cost-controls-backport.test.mjs

      - name: Verify the branch contains no automatic Vercel deploy job
        id: boundary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pull_request:' .github/workflows/vercel-deploy.yml
          grep -q 'release/vercel-preview' .github/workflows/vercel-deploy.yml
          grep -q 'npm run check' .github/workflows/vercel-deploy.yml
          ! grep -Eq '\bvercel[[:space:]]+(build|deploy|pull)\b' .github/workflows/vercel-deploy.yml
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('vercel.json', 'utf8'));
          if (config.git?.deploymentEnabled?.['*'] !== false) throw new Error('Missing wildcard deny');
          if (config.git?.deploymentEnabled?.main !== true) throw new Error('main is not allowed');
          if (config.git?.deploymentEnabled?.['release/vercel-preview'] !== true) throw new Error('release preview is not allowed');
          if (config.ignoreCommand !== 'node scripts/vercel-ignore-build.mjs') throw new Error('Ignored Build Step mismatch');
          NODE

      - name: Upload exact verification record
        if: always()
        shell: bash
        run: |
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg checks '${{ steps.checks.outcome }}' \
            --arg focused '${{ steps.focused.outcome }}' \
            --arg boundary '${{ steps.boundary.outcome }}' \
            '{sha:$sha,completeChecks:$checks,focusedContracts:$focused,releaseBoundary:$boundary}' \
            > pr17-cost-control-verification.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr17-cost-control-verification-${{ github.run_id }}
          path: pr17-cost-control-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Report exact result to PR 17
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ '${{ steps.checks.outcome }}' == 'success' && '${{ steps.focused.outcome }}' == 'success' && '${{ steps.boundary.outcome }}' == 'success' ]]; then
            gh pr comment 17 --repo "$GITHUB_REPOSITORY" --body "Exact-head Vercel cost-control backport verification passed at \`$GITHUB_SHA\`: complete \`npm run check\`, focused deployment-policy contracts, and the no-Vercel-deploy workflow boundary all passed. The branch remains draft and this result does not change its P-10 or outreach-readiness status. Evidence: $run_url"
          else
            gh pr comment 17 --repo "$GITHUB_REPOSITORY" --body "Exact-head Vercel cost-control backport verification did not pass all required checks at \`$GITHUB_SHA\`. No green-backport claim is made. Evidence: $run_url"
          fi

      - name: Remove one-time verifier with verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ '${{ steps.checks.outcome }}' == 'success' && '${{ steps.focused.outcome }}' == 'success' && '${{ steps.boundary.outcome }}' == 'success' ]]; then
            message='Remove one-time PR 17 cost-control verifier after PASS'
          else
            message='Remove one-time PR 17 cost-control verifier after FAIL'
          fi
          blob_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH?ref=agent/48-critique-pilot-20260730" --jq .sha 2>/dev/null || true)"
          if [[ -n "$blob_sha" ]]; then
            jq -n --arg message "$message" --arg sha "$blob_sha" --arg branch agent/48-critique-pilot-20260730 \
              '{message:$message,sha:$sha,branch:$branch}' \
              | gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$CONTROLLER_PATH" --input - >/dev/null
          fi

      - name: Enforce exact verification success
        if: always()
        shell: bash
        run: |
          test '${{ steps.checks.outcome }}' = 'success'
          test '${{ steps.focused.outcome }}' = 'success'
          test '${{ steps.boundary.outcome }}' = 'success'
