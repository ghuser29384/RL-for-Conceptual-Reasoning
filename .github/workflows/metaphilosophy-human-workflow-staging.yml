name: Metaphilosophy authenticated staging gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - "api/staging.mjs"
      - "src/staging-*.mjs"
      - "src/platform-server.mjs"
      - "src/server.mjs"
      - "staging/**"
      - "supabase/functions/metaphilosophy-staging-ledger/**"
      - "supabase/functions/metaphilosophy-staging-acceptance/**"
      - "scripts/bootstrap-staging-rehearsal.mjs"
      - "scripts/smoke-staging-runtime.mjs"
      - "scripts/smoke-staging-postgres.mjs"
      - "scripts/smoke-staging-server.mjs"
      - "scripts/run-human-workflow-support-tabletop.mjs"
      - "scripts/run-hosted-staging-acceptance.mjs"
      - "scripts/verify-human-workflow-staging.mjs"
      - "scripts/verify-v4-staging-schema.mjs"
      - "scripts/verify-vercel-oidc-staging-gateway.mjs"
      - "scripts/build-static.mjs"
      - "scripts/vercel-ignore-build.mjs"
      - "test/human-workflow-staging-contract.test.mjs"
      - "test/h11-access-gate-contract.test.mjs"
      - "test/hosted-staging-gateway-contract.test.mjs"
      - "test/vercel-cost-controls-backport.test.mjs"
      - "e2e/human-workflow-staging.spec.mjs"
      - "e2e/participant-readiness.spec.mjs"
      - "e2e/staging.playwright.config.mjs"
      - "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v*.sql"
      - "ops/next-steps-2026-07-23/human-workflow-*.md"
      - "ops/next-steps-2026-07-23/human-workflow-*.json"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/metaphilosophy-human-workflow-staging.yml"
  pull_request:
    paths:
      - "api/staging.mjs"
      - "src/staging-*.mjs"
      - "src/platform-server.mjs"
      - "src/server.mjs"
      - "staging/**"
      - "supabase/functions/metaphilosophy-staging-ledger/**"
      - "supabase/functions/metaphilosophy-staging-acceptance/**"
      - "scripts/bootstrap-staging-rehearsal.mjs"
      - "scripts/smoke-staging-runtime.mjs"
      - "scripts/smoke-staging-postgres.mjs"
      - "scripts/smoke-staging-server.mjs"
      - "scripts/run-human-workflow-support-tabletop.mjs"
      - "scripts/run-hosted-staging-acceptance.mjs"
      - "scripts/verify-human-workflow-staging.mjs"
      - "scripts/verify-v4-staging-schema.mjs"
      - "scripts/verify-vercel-oidc-staging-gateway.mjs"
      - "scripts/build-static.mjs"
      - "scripts/vercel-ignore-build.mjs"
      - "test/human-workflow-staging-contract.test.mjs"
      - "test/h11-access-gate-contract.test.mjs"
      - "test/hosted-staging-gateway-contract.test.mjs"
      - "test/vercel-cost-controls-backport.test.mjs"
      - "e2e/human-workflow-staging.spec.mjs"
      - "e2e/participant-readiness.spec.mjs"
      - "e2e/staging.playwright.config.mjs"
      - "ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v*.sql"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/metaphilosophy-human-workflow-staging.yml"

permissions:
  contents: read

concurrency:
  group: metaphilosophy-human-workflow-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-rehearsal:
    name: Contracts and synthetic rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check staging and compatibility syntax
        run: |
          node --check api/staging.mjs
          node --check src/staging-event-store.mjs
          node --check src/staging-rubric.mjs
          node --check src/staging-service.mjs
          node --check src/staging-server.mjs
          node --check src/platform-server.mjs
          node --check src/server.mjs
          node --check staging/app.mjs
          node --check staging/operator-token-guard.mjs
          node --check staging/participant-readiness.mjs
          node --check scripts/bootstrap-staging-rehearsal.mjs
          node --check scripts/smoke-staging-runtime.mjs
          node --check scripts/smoke-staging-postgres.mjs
          node --check scripts/smoke-staging-server.mjs
          node --check scripts/run-human-workflow-support-tabletop.mjs
          node --check scripts/run-hosted-staging-acceptance.mjs
          node --check scripts/verify-human-workflow-staging.mjs
          node --check scripts/verify-v4-staging-schema.mjs
          node --check scripts/verify-vercel-oidc-staging-gateway.mjs
          node --check test/hosted-staging-gateway-contract.test.mjs
          node --check test/h11-access-gate-contract.test.mjs
          node --check e2e/human-workflow-staging.spec.mjs
          node --check e2e/participant-readiness.spec.mjs
          node --check e2e/staging.playwright.config.mjs

      - name: Verify staging contracts
        run: npm run verify:staging

      - name: Run focused staging tests
        run: node --test test/human-workflow-staging-contract.test.mjs test/h11-access-gate-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs

      - name: Run complete repository tests
        run: npm test

      - name: Build ordinary public release without staging shell
        run: |
          npm run build
          test ! -e dist/staging

      - name: Build designated Vercel release-preview artifact
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: release/vercel-preview
        run: |
          npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/styles.css
          test -f dist/staging/participant-readiness.mjs
          test -f dist/staging/participant-readiness.css

      - name: Build explicit local controlled-staging release
        run: |
          STAGING_BUILD=true npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/styles.css
          test -f dist/staging/participant-readiness.mjs
          test -f dist/staging/participant-readiness.css

      - name: Run deterministic synthetic lifecycle rehearsal
        run: npm run smoke:server

      - name: Run the named support incident tabletop
        run: npm run tabletop:staging

      - name: Upload contract, rehearsal, and tabletop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphilosophy-staging-contract-rehearsal-${{ github.sha }}
          path: .staging-evidence
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

  postgres-persistence-rehearsal:
    name: Disposable Postgres persistence rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      STAGING_SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metaphilosophy_source
      STAGING_RESTORE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metaphilosophy_restore
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Create isolated source and restore databases
        run: |
          psql --version
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "create database metaphilosophy_source"
          psql "$POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 -c "create database metaphilosophy_restore"

      - name: Apply reviewed v1-v3 migrations to both databases
        run: |
          for database_url in "$STAGING_SOURCE_DATABASE_URL" "$STAGING_RESTORE_DATABASE_URL"; do
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v1.sql
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v2.sql
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v3.sql
          done

      - name: Exercise restart, readback, backup, and exact second-database restore
        run: npm run smoke:postgres

      - name: Apply and verify the v4 evidence and isolated restore contract
        run: |
          for database_url in "$STAGING_SOURCE_DATABASE_URL" "$STAGING_RESTORE_DATABASE_URL"; do
            psql "$database_url" -v ON_ERROR_STOP=1 -f ops/next-steps-2026-07-23/metaphilosophy-staging-schema-v4.sql
          done
          npm run verify:staging:v4

      - name: Upload disposable Postgres evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphilosophy-staging-postgres-${{ github.sha }}
          path: .staging-evidence
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

  rendered-browser-rehearsal:
    name: Rendered Chromium rehearsal
    needs:
      - contracts-and-rehearsal
      - postgres-persistence-rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Exercise the complete staged human workflow in Chromium
        run: npx playwright test --config=e2e/staging.playwright.config.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphilosophy-staging-browser-${{ github.sha }}
          path: .staging-evidence
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
