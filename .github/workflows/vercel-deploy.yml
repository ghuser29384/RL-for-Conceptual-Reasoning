name: Metaphilosophy release gates

on:
  pull_request:
  push:
    branches:
      - main
      - release/vercel-preview

permissions:
  contents: read

concurrency:
  group: metaphilosophy-release-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests and static production build
        run: npm run check

      - name: Record release boundary
        shell: bash
        run: |
          {
            echo '### Metaphilosophy release gates'
            echo
            echo '- Pull requests and `main` are validated in GitHub Actions only.'
            echo '- Only `release/vercel-preview` may create a Vercel Git deployment.'
            echo '- Production remains on the known-good deployment until an explicitly verified Preview is promoted.'
            echo '- This workflow contains no Vercel CLI build or deployment step.'
          } >> "$GITHUB_STEP_SUMMARY"
