name: Apply fail-closed H-11 access issuance gate once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/apply_h11_access_gate_v1.py"
      - ".github/workflows/apply-h11-access-gate-v1.yml"

permissions:
  contents: write

concurrency:
  group: apply-h11-access-gate-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact pilot branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fail-closed H-11 access-gate patch
        env:
          GITHUB_REF_NAME: agent/48-critique-pilot-20260730
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          source = Path(".github/apply_h11_access_gate_v1.py")
          spec = importlib.util.spec_from_file_location("h11_access_gate_patch", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def indent_nonblank(text: str, prefix: str) -> str:
              return "\n".join((prefix + line) if line else line for line in text.split("\n"))

          def robust_replace_once(path: str, old: str, new: str) -> None:
              text = module.read(path)
              if old in text:
                  module.write(path, text.replace(old, new, 1))
                  return
              for width in (2, 4, 6, 8):
                  prefix = " " * width
                  candidate = indent_nonblank(old, prefix)
                  if candidate in text:
                      module.write(path, text.replace(candidate, indent_nonblank(new, prefix), 1))
                      return
              raise RuntimeError(f"{path}: anchor not found: {old[:180]!r}")

          module.replace_once = robust_replace_once
          module.main()
          PY

      - name: Make access-gate supersession append-order deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/staging-service.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''function latestH11AccessGate(state, identityId, assignmentId) {
            return state.h11AccessGates
              .filter((record) => record.identityId === identityId && record.assignmentId === assignmentId)
              .sort((a, b) => b.recordedAt.localeCompare(a.recordedAt))[0] ?? null;
          }'''
          new = '''function latestH11AccessGate(state, identityId, assignmentId) {
            const candidates = state.h11AccessGates
              .filter((record) => record.identityId === identityId && record.assignmentId === assignmentId);
            return candidates.at(-1) ?? null;
          }'''
          if text.count(old) != 1:
              raise SystemExit("latest H-11 access-gate helper anchor did not match exactly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Keep workflow changes outside the GitHub Actions push token
        run: |
          git checkout -- .github/workflows/metaphilosophy-human-workflow-staging.yml
          rm -rf .github/__pycache__

      - name: Check diff and syntax
        run: |
          git diff --check
          node --check api/staging.mjs
          node --check src/staging-service.mjs
          node --check staging/app.mjs
          node --check staging/participant-readiness.mjs
          node --check scripts/verify-human-workflow-staging.mjs
          node --check test/human-workflow-staging-contract.test.mjs
          node --check test/h11-access-gate-contract.test.mjs
          node --check e2e/human-workflow-staging.spec.mjs

      - name: Verify staging contracts
        run: npm run verify:staging

      - name: Run focused H-11 and staging tests
        run: node --test test/h11-access-gate-contract.test.mjs test/human-workflow-staging-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs

      - name: Run complete repository tests
        run: npm test

      - name: Build ordinary public release without staging shell
        run: |
          npm run build
          test ! -e dist/staging

      - name: Build explicit controlled-staging release
        run: |
          STAGING_BUILD=true npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/participant-readiness.css
          test -f dist/staging/participant-readiness.mjs

      - name: Run synthetic lifecycle and support tabletop
        run: |
          npm run smoke:server
          npm run tabletop:staging

      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Run rendered Chromium workflow
        run: npx playwright test --config=e2e/staging.playwright.config.mjs

      - name: Upload temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h11-access-gate-${{ github.sha }}
          path: .staging-evidence
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Commit validated product change and remove one-shot files
        run: |
          test ! -e .github/apply_h11_access_gate_v1.py
          test ! -e .github/workflows/apply-h11-access-gate-v1.yml
          test ! -e .github/__pycache__
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add api/staging.mjs \
            src/staging-service.mjs \
            staging/index.html \
            staging/app.mjs \
            staging/participant-readiness.css \
            scripts/verify-human-workflow-staging.mjs \
            test/h11-access-gate-contract.test.mjs \
            e2e/human-workflow-staging.spec.mjs \
            ops/next-steps-2026-07-23/h11-fail-closed-access-issuance-gate-2026-08-07.md \
            .github/apply_h11_access_gate_v1.py \
            .github/workflows/apply-h11-access-gate-v1.yml
          git commit -m "Enforce the H-11 access issuance gate"
          git push origin HEAD:agent/48-critique-pilot-20260730
