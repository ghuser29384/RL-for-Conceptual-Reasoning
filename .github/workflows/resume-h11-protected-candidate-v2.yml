name: Resume narrow H-11 protected-staging candidate assembly

on:
  push:
    branches:
      - candidate/h11-protected-staging-20260807
    paths:
      - ".github/workflows/resume-h11-protected-candidate-v2.yml"

permissions:
  contents: write

concurrency:
  group: assemble-h11-protected-candidate-20260807
  cancel-in-progress: true

jobs:
  assemble-validate-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASE_SHA: 202135a21fb15f5a12698e6a78e8c8d8b7fa79ef
      SOURCE_SHA: aec2004789be192f2fb08e98f365faa371f20ba7
      CANDIDATE_BRANCH: candidate/h11-protected-staging-20260807
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      STAGING_SOURCE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metaphilosophy_source
      STAGING_RESTORE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metaphilosophy_restore

    steps:
      - name: Check out exact candidate branch and full history
        uses: actions/checkout@v4
        with:
          ref: candidate/h11-protected-staging-20260807
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reset generated build outputs before pushing the validated candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/assemble-h11-protected-candidate-v2.sh")
          text = path.read_text(encoding="utf-8")
          old = 'test -z "$(git status --porcelain)"\n\ngit push origin HEAD:"$CANDIDATE_BRANCH"'
          new = '''# Validation commands may update tracked build outputs and create untracked
          # browser/build artifacts. None belongs in the narrow candidate history.
          git reset --hard HEAD
          git clean -fdx -e .staging-evidence/
          git diff --quiet
          git diff --cached --quiet

          git push origin HEAD:"$CANDIDATE_BRANCH"'''
          if text.count(old) != 1:
              raise SystemExit("Expected final clean-tree assertion anchor exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Assemble and validate the exact narrow candidate
        run: bash scripts/assemble-h11-protected-candidate-v2.sh

      - name: Upload exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h11-narrow-protected-candidate-${{ github.run_id }}
          path: |
            .staging-evidence
            ops/next-steps-2026-07-23/h11-narrow-protected-staging-candidate-2026-08-07-v1.json
            ops/next-steps-2026-07-23/h11-narrow-protected-staging-candidate-evidence-2026-08-07-v1.json
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
