name: Apply hosted acceptance run isolation once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/workflows/apply-hosted-acceptance-run-isolation-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-hosted-acceptance-run-isolation-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the controlled branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply the bounded run-isolation repair
        run: |
          python scripts/apply-hosted-acceptance-run-isolation.py
          rm scripts/apply-hosted-acceptance-run-isolation.py
          rm .github/workflows/apply-hosted-acceptance-run-isolation-once.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Validate the repaired hosted acceptance path
        run: |
          node --check scripts/run-hosted-staging-acceptance.mjs
          node --check test/hosted-staging-gateway-contract.test.mjs
          npm run verify:staging
          node --test test/hosted-staging-gateway-contract.test.mjs
          npm test
          git diff --check

      - name: Commit the validated repair and remove one-time files
        env:
          BRANCH: agent/48-critique-pilot-20260730
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Isolate hosted acceptance assertions by synthetic run"
          git push origin "HEAD:${BRANCH}"
