name: Pilot endpoint diagnostic

on:
  push:
    branches:
      - implementation/pilot-endpoints-v1-20260816

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Capture test output
        id: tests
        shell: bash
        run: |
          set +e
          npm test > pilot-endpoint-test-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > pilot-endpoint-test-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: pilot-endpoint-test-output-${{ github.sha }}
          path: |
            pilot-endpoint-test-output.txt
            pilot-endpoint-test-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Preserve test conclusion
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
