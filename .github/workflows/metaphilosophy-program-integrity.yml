name: Metaphilosophy programme integrity

on:
  pull_request:
    paths:
      - "ops/next-steps-2026-07-23/**"
      - "ops/pilot-01/**"
      - "funding/**"
      - "reviewers/closed.html"
      - "pilot-raters/**"
      - "api/reviewer-recruitment.mjs"
      - "api/pilot-rater-eoi.mjs"
      - "src/recruitment/pilot-rater-eoi.mjs"
      - "src/vercel/pilot-rater-eoi-handler.mjs"
      - "vercel.json"
      - "scripts/build-static.mjs"
      - "scripts/verify-program-contracts.mjs"
      - "scripts/verify-hard-set-source-allocation.mjs"
      - "scripts/verify-panel-honoraria-plan.mjs"
      - "scripts/verify-pilot-01.mjs"
      - "scripts/calculate-honoraria.mjs"
      - "scripts/calculate-pilot-honoraria.mjs"
      - "test/recruitment-intake-gate.test.mjs"
      - "test/hard-set-source-allocation.test.mjs"
      - "test/panel-honoraria-plan.test.mjs"
      - "test/honoraria-calculator.test.mjs"
      - "test/pilot-rater-eoi.test.mjs"
      - "test/pilot-01-contract.test.mjs"
      - "test/pilot-honoraria-calculator.test.mjs"
      - ".github/workflows/metaphilosophy-program-integrity.yml"
  push:
    branches: [main]
    paths:
      - "ops/next-steps-2026-07-23/**"
      - "ops/pilot-01/**"
      - "funding/**"
      - "reviewers/closed.html"
      - "pilot-raters/**"
      - "api/reviewer-recruitment.mjs"
      - "api/pilot-rater-eoi.mjs"
      - "src/recruitment/pilot-rater-eoi.mjs"
      - "src/vercel/pilot-rater-eoi-handler.mjs"
      - "vercel.json"
      - "scripts/build-static.mjs"
      - "scripts/verify-program-contracts.mjs"
      - "scripts/verify-hard-set-source-allocation.mjs"
      - "scripts/verify-panel-honoraria-plan.mjs"
      - "scripts/verify-pilot-01.mjs"
      - "scripts/calculate-honoraria.mjs"
      - "scripts/calculate-pilot-honoraria.mjs"
      - "test/recruitment-intake-gate.test.mjs"
      - "test/hard-set-source-allocation.test.mjs"
      - "test/panel-honoraria-plan.test.mjs"
      - "test/honoraria-calculator.test.mjs"
      - "test/pilot-rater-eoi.test.mjs"
      - "test/pilot-01-contract.test.mjs"
      - "test/pilot-honoraria-calculator.test.mjs"
      - ".github/workflows/metaphilosophy-program-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-hard-set-source-allocation.mjs
      - run: node scripts/verify-panel-honoraria-plan.mjs
      - run: node scripts/verify-pilot-01.mjs
      - run: node scripts/verify-program-contracts.mjs
      - run: node scripts/calculate-honoraria.mjs --help
      - run: node scripts/calculate-pilot-honoraria.mjs --help
      - run: npm test
      - run: npm run build
