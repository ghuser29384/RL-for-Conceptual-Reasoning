name: Metaphilosophy programme integrity

on:
  pull_request:
    paths:
      - "ops/next-steps-2026-07-23/**"
      - "reviewers/closed.html"
      - "api/reviewer-recruitment.mjs"
      - "vercel.json"
      - "scripts/verify-program-contracts.mjs"
      - "scripts/verify-pilot-48-plan.mjs"
      - "scripts/verify-pilot-methodology-recommendations.mjs"
      - "scripts/verify-pilot-readiness-ledger.mjs"
      - "scripts/verify-pilot-rating-analysis-contract.mjs"
      - "scripts/pilot-rating-analysis.mjs"
      - "scripts/verify-hard-set-source-allocation.mjs"
      - "scripts/verify-panel-honoraria-plan.mjs"
      - "scripts/calculate-honoraria.mjs"
      - "test/recruitment-intake-gate.test.mjs"
      - "test/pilot-48-plan.test.mjs"
      - "test/pilot-methodology-recommendations.test.mjs"
      - "test/pilot-readiness-ledger.test.mjs"
      - "test/pilot-rating-analysis-contract.test.mjs"
      - "test/pilot-rating-analysis.test.mjs"
      - "test/hard-set-source-allocation.test.mjs"
      - "test/panel-honoraria-plan.test.mjs"
      - "test/honoraria-calculator.test.mjs"
      - ".github/workflows/metaphilosophy-program-integrity.yml"
  push:
    branches: [main]
    paths:
      - "ops/next-steps-2026-07-23/**"
      - "reviewers/closed.html"
      - "api/reviewer-recruitment.mjs"
      - "vercel.json"
      - "scripts/verify-program-contracts.mjs"
      - "scripts/verify-pilot-48-plan.mjs"
      - "scripts/verify-pilot-methodology-recommendations.mjs"
      - "scripts/verify-pilot-readiness-ledger.mjs"
      - "scripts/verify-pilot-rating-analysis-contract.mjs"
      - "scripts/pilot-rating-analysis.mjs"
      - "scripts/verify-hard-set-source-allocation.mjs"
      - "scripts/verify-panel-honoraria-plan.mjs"
      - "scripts/calculate-honoraria.mjs"
      - "test/recruitment-intake-gate.test.mjs"
      - "test/pilot-48-plan.test.mjs"
      - "test/pilot-methodology-recommendations.test.mjs"
      - "test/pilot-readiness-ledger.test.mjs"
      - "test/pilot-rating-analysis-contract.test.mjs"
      - "test/pilot-rating-analysis.test.mjs"
      - "test/hard-set-source-allocation.test.mjs"
      - "test/panel-honoraria-plan.test.mjs"
      - "test/honoraria-calculator.test.mjs"
      - ".github/workflows/metaphilosophy-program-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-pilot-48-plan.mjs
      - run: node scripts/verify-pilot-methodology-recommendations.mjs
      - run: node scripts/verify-pilot-readiness-ledger.mjs
      - run: node scripts/verify-pilot-rating-analysis-contract.mjs
      - run: node scripts/pilot-rating-analysis.mjs --help
      - run: node scripts/verify-hard-set-source-allocation.mjs
      - run: node scripts/verify-panel-honoraria-plan.mjs
      - run: node scripts/verify-program-contracts.mjs
      - run: node scripts/calculate-honoraria.mjs --help
      - run: npm test
      - run: npm run build
