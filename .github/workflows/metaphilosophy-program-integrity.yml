permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-pilot-48-plan.mjs
      - run: node scripts/verify-pilot-methodology-recommendations.mjs
      - run: node scripts/verify-pilot-readiness-ledger.mjs
      - run: node scripts/verify-pilot-assignment-contract.mjs
      - run: node scripts/pilot-assignment-generator.mjs --help
      - run: node scripts/pilot-assignment-generator.mjs ops/next-steps-2026-07-23/pilot-methodology-recommendations.json test/fixtures/pilot-assignment-synthetic.json > /tmp/pilot-assignment-summary.json
      - run: node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("/tmp/pilot-assignment-summary.json","utf8")); const text=JSON.stringify(report); const forbidden=["\"participant_id\":","\"position_id\":","\"critique_id\":","\"anonymous_slot_mapping\":","\"position_assignments\":"]; if(report.mode!=="simulation" || report.feasibility.feasible_mapping_count!==1 || report.rating_work_authorized || report.phase_2_authorized || report.privacy.contains_participant_ids!==false || report.privacy.contains_position_or_critique_ids!==false || report.privacy.contains_assignment_pairs!==false || forbidden.some((token)=>text.includes(token))) process.exit(1);'
      - run: node scripts/verify-pilot-task-bundle-contract.mjs
      - run: node scripts/verify-pilot-task-bundle-integration.mjs
      - run: node scripts/pilot-task-bundle-generator.mjs --help
      - run: node scripts/pilot-task-bundle-generator.mjs ops/next-steps-2026-07-23/pilot-methodology-recommendations.json test/fixtures/pilot-assignment-synthetic.json test/fixtures/pilot-task-content-synthetic.json > /tmp/pilot-task-bundle-summary.json
      - run: node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("/tmp/pilot-task-bundle-summary.json","utf8")); const text=JSON.stringify(report); const forbidden=["\"participant_id\":","\"position_id\":","\"critique_id\":","\"task_position_token\":","\"task_critique_token\":","\"bundle_id\":","\"task_bundle_sha256\":","\"participant_bundles\":","\"operator_index\":"]; if(report.mode!=="simulation" || report.counts.task_bundles!==6 || report.counts.total_bundle_critique_presentations!==96 || report.distribution_authorized || report.rating_work_authorized || report.phase_2_authorized || report.privacy.contains_participant_ids!==false || report.privacy.contains_position_or_critique_ids!==false || report.privacy.contains_task_tokens!==false || forbidden.some((token)=>text.includes(token))) process.exit(1);'
      - run: node scripts/verify-pilot-rating-ingestion-contract.mjs
      - run: node scripts/verify-pilot-rating-ingestion-integration.mjs
      - run: node scripts/pilot-rating-ingestion.mjs --help
      - run: node scripts/verify-pilot-rating-analysis-contract.mjs
      - run: node scripts/verify-pilot-public-analysis.mjs
      - run: node scripts/pilot-rating-analysis.mjs --help
      - run: node scripts/run-pilot-rating-analysis.mjs --help
      - run: node scripts/run-pilot-rating-analysis.mjs test/fixtures/pilot-rating-analysis-synthetic.json ops/next-steps-2026-07-23/pilot-analysis-policy-template.json > /tmp/pilot-analysis-report.json
      - run: node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("/tmp/pilot-analysis-report.json","utf8")); const text=JSON.stringify(report); const forbidden=["\"dataset_id\":","\"position_id\":","\"critique_id\":","\"rating_id\":","\"rater_id\":","\"rater_ids\":","\"route_results\":"]; if(!report.diagnostic_only || report.phase_2_authorized || report.initial.aggregate.critiques_with_operative_routes !== 0 || report.latest_accepted.aggregate.critiques_with_operative_routes !== 0 || forbidden.some((token)=>text.includes(token))) process.exit(1);'
      - run: node scripts/verify-pilot-adjudication-readiness.mjs
      - run: node scripts/verify-pilot-adjudication-contract.mjs
      - run: node scripts/verify-pilot-adjudication-integration.mjs
      - run: node scripts/run-pilot-adjudication.mjs --help
      - run: node scripts/run-pilot-adjudication.mjs test/fixtures/pilot-rating-analysis-synthetic.json test/fixtures/pilot-analysis-policy-adjudication-synthetic.json test/fixtures/pilot-adjudication-control-synthetic.json > /tmp/pilot-adjudication-summary.json
      - run: node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("/tmp/pilot-adjudication-summary.json","utf8")); const text=JSON.stringify(report); const forbidden=["\"adjudicator_id\":","\"rater_id\":","\"position_id\":","\"critique_id\":","\"rating_id\":","\"case_id\":","\"case_packet_sha256\":","\"initial_ratings\":"]; if(report.mode!=="simulation" || report.counts.case_count!==2 || report.counts.assigned_to_two_dedicated_adjudicators!==true || report.counts.maximum_assignment_imbalance!==0 || report.distribution_authorized || report.adjudication_work_authorized || report.rerating_work_authorized || report.payment_authorized || report.phase_2_authorized || forbidden.some((token)=>text.includes(token))) process.exit(1);'
      - run: node scripts/verify-hard-set-source-allocation.mjs
      - run: node scripts/verify-panel-honoraria-plan.mjs
      - run: node scripts/verify-program-contracts.mjs
      - run: node scripts/calculate-honoraria.mjs --help
      - run: npm test
      - run: npm run build
