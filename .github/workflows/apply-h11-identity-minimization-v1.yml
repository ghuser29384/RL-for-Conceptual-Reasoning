name: Apply H-11 direct-identifier minimization once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/apply_h11_identity_minimization_v1.py"
      - ".github/workflows/apply-h11-identity-minimization-v1.yml"

permissions:
  contents: write

concurrency:
  group: apply-h11-identity-minimization-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact pilot branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply minimization patch with indentation-safe anchors
        env:
          GITHUB_REF_NAME: agent/48-critique-pilot-20260730
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          source = Path(".github/apply_h11_identity_minimization_v1.py")
          spec = importlib.util.spec_from_file_location("h11_identity_minimization", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def indent_nonblank(text: str, prefix: str) -> str:
              return "\n".join((prefix + line) if line else line for line in text.split("\n"))

          def robust_replace_once(path: str, old: str, new: str) -> None:
              text = module.read(path)
              if old in text:
                  module.write(path, text.replace(old, new, 1))
                  return
              for width in (2, 4, 6, 8):
                  prefix = " " * width
                  candidate = indent_nonblank(old, prefix)
                  if candidate in text:
                      module.write(path, text.replace(candidate, indent_nonblank(new, prefix), 1))
                      return
              raise RuntimeError(f"{path}: anchor not found: {old[:180]!r}")

          module.replace_once = robust_replace_once
          module.main()
          PY

      - name: Remove Python cache from the candidate tree
        run: rm -rf .github/__pycache__

      - name: Check diff and syntax
        run: |
          git diff --check
          node --check src/staging-service.mjs
          node --check staging/app.mjs
          node --check scripts/verify-human-workflow-staging.mjs
          node --check test/h11-access-gate-contract.test.mjs
          node --check test/human-workflow-staging-contract.test.mjs
          node --check e2e/human-workflow-staging.spec.mjs

      - name: Verify staging contracts
        run: npm run verify:staging

      - name: Run focused H-11 and staging tests
        run: node --test test/h11-access-gate-contract.test.mjs test/human-workflow-staging-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs

      - name: Run complete repository tests
        run: npm test

      - name: Build ordinary public release without staging shell
        run: |
          npm run build
          test ! -e dist/staging

      - name: Build explicit controlled-staging release
        run: |
          STAGING_BUILD=true npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/participant-readiness.css
          test -f dist/staging/participant-readiness.mjs

      - name: Run synthetic lifecycle and support tabletop
        run: |
          npm run smoke:server
          npm run tabletop:staging

      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Run rendered Chromium workflow
        run: npx playwright test --config=e2e/staging.playwright.config.mjs

      - name: Upload temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h11-identity-minimization-${{ github.sha }}
          path: .staging-evidence
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Commit validated minimization and remove one-shot files
        run: |
          test ! -e .github/apply_h11_identity_minimization_v1.py
          test ! -e .github/workflows/apply-h11-identity-minimization-v1.yml
          test ! -e .github/__pycache__
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add src/staging-service.mjs \
            staging/index.html \
            staging/app.mjs \
            scripts/verify-human-workflow-staging.mjs \
            test/h11-access-gate-contract.test.mjs \
            e2e/human-workflow-staging.spec.mjs \
            ops/next-steps-2026-07-23/h11-fail-closed-access-issuance-gate-2026-08-07.md \
            .github/apply_h11_identity_minimization_v1.py \
            .github/workflows/apply-h11-identity-minimization-v1.yml
          git commit -m "Minimize direct identifiers in H-11 staging records"
          git push origin HEAD:agent/48-critique-pilot-20260730
