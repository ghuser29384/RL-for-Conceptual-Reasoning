name: Apply hosted acceptance retry once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/workflows/apply-hosted-acceptance-retry-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-hosted-acceptance-retry-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the controlled branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply bounded retry and append-only resume changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              file = Path(path)
              text = file.read_text()
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {before[:120]!r}")
              file.write_text(text.replace(before, after, 1))

          event_store = Path("src/staging-event-store.mjs")
          event_text = event_store.read_text()
          old_request = '''  async request(action, extra = {}) {
    const headers = {
      Accept: "application/json",
      Authorization: `Bearer ${this.oidcToken}`,
      "Content-Type": "application/json",
    };
    if (this.expectedReleaseSha) headers["X-Metaphilosophy-Release-Sha"] = this.expectedReleaseSha;
    if (this.expectedBranch) headers["X-Metaphilosophy-Release-Branch"] = this.expectedBranch;
    const response = await fetch(this.gatewayUrl, {
      method: "POST",
      headers,
      cache: "no-store",
      body: JSON.stringify({ action, ...extra }),
    });
    const payload = await response.json().catch(() => null);
    if (!response.ok || !payload?.ok) {
      const error = new Error(payload?.error?.message || `Hosted staging gateway failed with HTTP ${response.status}.`);
      error.status = response.status;
      error.code = payload?.error?.code || "hosted_gateway_error";
      throw error;
    }
    return payload.data;
  }
'''
          new_request = '''  async request(action, extra = {}) {
    const headers = {
      Accept: "application/json",
      Authorization: `Bearer ${this.oidcToken}`,
      "Content-Type": "application/json",
    };
    if (this.expectedReleaseSha) headers["X-Metaphilosophy-Release-Sha"] = this.expectedReleaseSha;
    if (this.expectedBranch) headers["X-Metaphilosophy-Release-Branch"] = this.expectedBranch;

    for (let attempt = 1; attempt <= 3; attempt += 1) {
      let response;
      let payload;
      try {
        response = await fetch(this.gatewayUrl, {
          method: "POST",
          headers,
          cache: "no-store",
          body: JSON.stringify({ action, ...extra }),
        });
        payload = await response.json().catch(() => null);
      } catch (error) {
        if (attempt === 3 || !isTransientHostedGatewayError(error)) throw error;
        await delayHostedGatewayRetry(attempt);
        continue;
      }

      if (response.ok && payload?.ok) return payload.data;
      const error = new Error(payload?.error?.message || `Hosted staging gateway failed with HTTP ${response.status}.`);
      error.status = response.status;
      error.code = payload?.error?.code || "hosted_gateway_error";
      if (attempt === 3 || !isTransientHostedGatewayError(error)) throw error;
      await delayHostedGatewayRetry(attempt);
    }

    throw new Error("Hosted staging gateway exhausted its bounded retry policy.");
  }
'''
          if event_text.count(old_request) != 1:
              raise SystemExit("src/staging-event-store.mjs: hosted request block drifted")
          event_text = event_text.replace(old_request, new_request, 1)
          helper_anchor = 'function assertHostedBoundary(data) {'
          helpers = '''function isTransientHostedGatewayError(error) {
  const status = Number(error?.status);
  const code = String(error?.code ?? "");
  return !Number.isFinite(status)
    || status >= 500
    || (status === 401 && code === "oidc_token_rejected");
}

function delayHostedGatewayRetry(attempt) {
  return new Promise((resolveDelay) => setTimeout(resolveDelay, 250 * attempt));
}

'''
          if event_text.count(helper_anchor) != 1:
              raise SystemExit("src/staging-event-store.mjs: hosted boundary anchor drifted")
          event_text = event_text.replace(helper_anchor, helpers + helper_anchor, 1)
          event_store.write_text(event_text)

          replace_once(
              "src/staging-service.mjs",
              '  async bootstrap({ bootstrapToken, expectedBootstrapToken, operatorEmail = "operator@example.invalid", fixture = defaultRehearsalFixture() }) {',
              '  async bootstrap({ bootstrapToken, expectedBootstrapToken, operatorEmail = "operator@example.invalid", fixture = defaultRehearsalFixture(), allowExistingOperator = false }) {',
          )
          replace_once(
              "src/staging-service.mjs",
              '    if (state.identities.some((identity) => identity.role === "operator" && identity.status === "active")) {',
              '    if (!allowExistingOperator && state.identities.some((identity) => identity.role === "operator" && identity.status === "active")) {',
          )

          acceptance = Path("scripts/run-hosted-staging-acceptance.mjs")
          acceptance_text = acceptance.read_text()
          acceptance_text = acceptance_text.replace(
              'const REPORT_KIND = "protected-hosted-synthetic-lifecycle-v1";',
              'const REPORT_KIND = "protected-hosted-synthetic-lifecycle-v2";',
              1,
          )
          replace_target = '''assert.equal(initialStatus.metadata?.research_ratings_authorized, false);
assert.equal(initialStatus.researchRatingsAuthorized, false);
'''
          replace_value = '''assert.equal(initialStatus.metadata?.research_ratings_authorized, false);
assert.equal(initialStatus.researchRatingsAuthorized, false);
const startingPrimary = structuredClone(initialStatus.primary);
'''
          if acceptance_text.count(replace_target) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: initial status anchor drifted")
          acceptance_text = acceptance_text.replace(replace_target, replace_value, 1)
          old_empty = '''if (initialStatus.primary.eventCount !== 0 || initialStatus.restore.eventCount !== 0) {
  throw new Error(
    `Hosted staging acceptance requires an empty primary and restore ledger when no exact-release report exists; found ${initialStatus.primary.eventCount} and ${initialStatus.restore.eventCount}.`,
  );
}
'''
          new_empty = '''if (initialStatus.restore.eventCount !== 0) {
  throw new Error(
    `Hosted staging acceptance requires an empty restore ledger when no exact-release report exists; found ${initialStatus.restore.eventCount}.`,
  );
}
'''
          if acceptance_text.count(old_empty) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: empty-ledger gate drifted")
          acceptance_text = acceptance_text.replace(old_empty, new_empty, 1)
          old_setup = '''let currentTime = new Date("2026-08-06T11:30:00.000Z");
const now = () => new Date(currentTime);
const timeline = [];
const store = makeStore();
'''
          new_setup = '''const acceptanceRunId = crypto.randomUUID();
const fixture = hostedRehearsalFixture(acceptanceRunId);
let currentTime = new Date("2026-08-06T14:00:00.000Z");
const now = () => new Date(currentTime);
const timeline = [];
if (startingPrimary.eventCount > 0) timeline.push("prior_failed_attempt_chain_preserved_append_only");
const store = makeStore();
'''
          if acceptance_text.count(old_setup) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: run setup drifted")
          acceptance_text = acceptance_text.replace(old_setup, new_setup, 1)
          old_bootstrap = '''const bootstrap = await service.bootstrap({
  bootstrapToken: bootstrapSecret,
  expectedBootstrapToken: bootstrapSecret,
  operatorEmail: "operator@hosted-acceptance.metaphilosophy.invalid",
});
'''
          new_bootstrap = '''const bootstrap = await service.bootstrap({
  bootstrapToken: bootstrapSecret,
  expectedBootstrapToken: bootstrapSecret,
  operatorEmail: "operator@hosted-acceptance.metaphilosophy.invalid",
  fixture,
  allowExistingOperator: true,
});
'''
          if acceptance_text.count(old_bootstrap) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: bootstrap block drifted")
          acceptance_text = acceptance_text.replace(old_bootstrap, new_bootstrap, 1)
          report_anchor = '''  exactReleaseSha,
  releaseBranch: RELEASE_PREVIEW_BRANCH,
'''
          report_value = '''  exactReleaseSha,
  releaseBranch: RELEASE_PREVIEW_BRANCH,
  acceptanceRunId,
  preservedPriorPrimary: startingPrimary,
'''
          if acceptance_text.count(report_anchor) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: report anchor drifted")
          acceptance_text = acceptance_text.replace(report_anchor, report_value, 1)
          old_acceptance_request = '''async function acceptanceRequest(action, extra = {}) {
  const response = await fetch(ACCEPTANCE_URL, {
    method: "POST",
    headers: {
      Accept: "application/json",
      Authorization: `Bearer ${oidcToken}`,
      "Content-Type": "application/json",
      "X-Metaphilosophy-Release-Sha": exactReleaseSha,
      "X-Metaphilosophy-Release-Branch": RELEASE_PREVIEW_BRANCH,
    },
    body: JSON.stringify({ action, exactReleaseSha, ...extra }),
    signal: AbortSignal.timeout(120_000),
  });
  const payload = await response.json().catch(() => null);
  if (!response.ok || payload?.ok !== true) {
    throw new Error(
      payload?.error?.message
        ? `${action} failed with HTTP ${response.status}: ${payload.error.code} ${payload.error.message}`
        : `${action} failed with HTTP ${response.status}.`,
    );
  }
  return payload.data;
}
'''
          new_acceptance_request = '''async function acceptanceRequest(action, extra = {}) {
  for (let attempt = 1; attempt <= 3; attempt += 1) {
    let response;
    let payload;
    try {
      response = await fetch(ACCEPTANCE_URL, {
        method: "POST",
        headers: {
          Accept: "application/json",
          Authorization: `Bearer ${oidcToken}`,
          "Content-Type": "application/json",
          "X-Metaphilosophy-Release-Sha": exactReleaseSha,
          "X-Metaphilosophy-Release-Branch": RELEASE_PREVIEW_BRANCH,
        },
        body: JSON.stringify({ action, exactReleaseSha, ...extra }),
        signal: AbortSignal.timeout(120_000),
      });
      payload = await response.json().catch(() => null);
    } catch (error) {
      if (attempt === 3) throw error;
      await new Promise((resolveDelay) => setTimeout(resolveDelay, 250 * attempt));
      continue;
    }
    if (response.ok && payload?.ok === true) return payload.data;
    const retryable = response.status >= 500
      || (response.status === 401 && payload?.error?.code === "oidc_token_rejected");
    if (!retryable || attempt === 3) {
      throw new Error(
        payload?.error?.message
          ? `${action} failed with HTTP ${response.status}: ${payload.error.code} ${payload.error.message}`
          : `${action} failed with HTTP ${response.status}.`,
      );
    }
    await new Promise((resolveDelay) => setTimeout(resolveDelay, 250 * attempt));
  }
  throw new Error(`${action} exhausted its bounded hosted acceptance retry policy.`);
}
'''
          if acceptance_text.count(old_acceptance_request) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: acceptance request block drifted")
          acceptance_text = acceptance_text.replace(old_acceptance_request, new_acceptance_request, 1)
          fixture_anchor = 'function makeRating(overall, strength, overrides = {}) {'
          fixture_helper = '''function hostedRehearsalFixture(runId) {
  const prefix = `synthetic-hosted-${runId}`;
  return {
    position: {
      id: `${prefix}-position`,
      version: "1",
      title: "Synthetic hosted rehearsal: contextualized conceptual critique evaluation",
      text: "A community can improve judgment on conceptual questions by comparing contextualized objections even when it lacks a decisive answer to the underlying question. Comparative evaluation of relevance, correctness, clarity, and argumentative force can therefore provide useful supervision for systems that reason about philosophy.",
      context: "This uniquely identified record exists only for the protected hosted synthetic acceptance run and must never enter Pilot 01 research results.",
    },
    critiques: [
      { id: `${prefix}-critique-001`, version: "1", text: "Agreement about local argumentative qualities could reflect a shared but systematically biased standard, so convergence alone does not establish epistemic progress." },
      { id: `${prefix}-critique-002`, version: "1", text: "The position does not specify how omitted background commitments are represented; an objection can appear decisive only because the relevant context has been withheld." },
      { id: `${prefix}-critique-003`, version: "1", text: "Even if critique evaluation is easier than settling conclusions, the ratings may still be too noisy to provide useful supervision. Comparative ease is not adequacy." },
      { id: `${prefix}-critique-004`, version: "1", text: "Famous objections may survive because of canon formation rather than merit, so training on expert consensus can reproduce historical selection effects." },
    ],
  };
}

'''
          if acceptance_text.count(fixture_anchor) != 1:
              raise SystemExit("scripts/run-hosted-staging-acceptance.mjs: rating helper anchor drifted")
          acceptance_text = acceptance_text.replace(fixture_anchor, fixture_helper + fixture_anchor, 1)
          acceptance.write_text(acceptance_text)

          test_path = Path("test/hosted-staging-resume.test.mjs")
          test_path.write_text('''import assert from "node:assert/strict";
import { mkdtemp } from "node:fs/promises";
import { tmpdir } from "node:os";
import { join } from "node:path";
import test from "node:test";

import { FileEventStore, RemoteEventStore } from "../src/staging-event-store.mjs";
import { StagingWorkflowService } from "../src/staging-service.mjs";

test("RemoteEventStore retries a bounded transient OIDC verification rejection", async () => {
  const originalFetch = globalThis.fetch;
  let calls = 0;
  globalThis.fetch = async () => {
    calls += 1;
    if (calls < 3) {
      return new Response(JSON.stringify({ ok: false, error: { code: "oidc_token_rejected", message: "temporary verifier failure" } }), {
        status: 401,
        headers: { "Content-Type": "application/json" },
      });
    }
    return new Response(JSON.stringify({
      ok: true,
      data: {
        chain: { ok: true, events: 0, headHash: "0".repeat(64) },
        metadata: { purpose: "synthetic_rehearsal_only" },
        researchRatingsAuthorized: false,
      },
    }), { status: 200, headers: { "Content-Type": "application/json" } });
  };
  try {
    const store = new RemoteEventStore({ gatewayUrl: "https://example.invalid/ledger", oidcToken: "synthetic-oidc" });
    const chain = await store.initialize();
    assert.equal(chain.events, 0);
    assert.equal(calls, 3);
  } finally {
    globalThis.fetch = originalFetch;
  }
});

test("explicit append-only acceptance bootstrap can preserve an earlier synthetic operator", async () => {
  const directory = await mkdtemp(join(tmpdir(), "metaphilosophy-resume-test-"));
  const store = new FileEventStore({ filePath: join(directory, "events.jsonl") });
  const service = new StagingWorkflowService({ store, now: () => new Date("2026-08-06T14:00:00.000Z") });
  await service.initialize();
  await service.bootstrap({ bootstrapToken: "first", expectedBootstrapToken: "first" });
  await assert.rejects(
    () => service.bootstrap({ bootstrapToken: "blocked", expectedBootstrapToken: "blocked" }),
    (error) => error.status === 409 && error.code === "bootstrap_already_completed",
  );
  const runId = "append-only-resume";
  await service.bootstrap({
    bootstrapToken: "second",
    expectedBootstrapToken: "second",
    allowExistingOperator: true,
    fixture: {
      position: { id: `${runId}-position`, version: "1", title: "Synthetic resume fixture", text: "A synthetic position used only to verify append-only acceptance recovery.", context: "No research use." },
      critiques: [1, 2, 3, 4].map((number) => ({ id: `${runId}-critique-${number}`, version: "1", text: `Synthetic critique ${number} for append-only recovery verification.` })),
    },
  });
  const state = await service.state();
  assert.equal(state.identities.filter((identity) => identity.role === "operator").length, 2);
  assert.equal(state.positions.length, 2);
  assert.equal(state.critiques.length, 8);
  assert.equal((await store.verifyChain()).ok, true);
});
''')

          workflow = Path(".github/workflows/metaphilosophy-human-workflow-staging.yml")
          workflow_text = workflow.read_text()
          workflow_text = workflow_text.replace(
              "          node --check test/hosted-staging-gateway-contract.test.mjs\n",
              "          node --check test/hosted-staging-gateway-contract.test.mjs\n          node --check test/hosted-staging-resume.test.mjs\n",
              1,
          )
          workflow_text = workflow_text.replace(
              "        run: node --test test/human-workflow-staging-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs\n",
              "        run: node --test test/human-workflow-staging-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs test/hosted-staging-resume.test.mjs\n",
              1,
          )
          workflow.write_text(workflow_text)
          PY

          rm -f .github/workflows/apply-hosted-acceptance-retry-once.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the focused repair
        run: |
          node --check src/staging-event-store.mjs
          node --check src/staging-service.mjs
          node --check scripts/run-hosted-staging-acceptance.mjs
          node --check test/hosted-staging-resume.test.mjs
          npm run verify:staging
          node --test test/hosted-staging-resume.test.mjs test/hosted-staging-gateway-contract.test.mjs
          npm test
          npm run build

      - name: Commit the repair and remove this workflow
        env:
          BRANCH: agent/48-critique-pilot-20260730
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Resume hosted acceptance with bounded OIDC retries"
          git push origin "HEAD:${BRANCH}"
