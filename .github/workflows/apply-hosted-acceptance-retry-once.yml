name: Apply hosted acceptance retry once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/workflows/apply-hosted-acceptance-retry-once.yml"

permissions:
  contents: write

concurrency:
  group: apply-hosted-acceptance-retry-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the controlled branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply bounded retry and append-only resume changes
        run: |
          python scripts/apply-hosted-acceptance-retry-once.py
          git checkout -- .github/workflows/metaphilosophy-human-workflow-staging.yml

      - name: Install exact dependencies
        run: npm ci

      - name: Verify the focused repair
        run: |
          node --check src/staging-event-store.mjs
          node --check src/staging-service.mjs
          node --check scripts/run-hosted-staging-acceptance.mjs
          node --check test/hosted-staging-resume.test.mjs
          npm run verify:staging
          node --test test/hosted-staging-resume.test.mjs test/hosted-staging-gateway-contract.test.mjs
          npm test
          npm run build

      - name: Commit only tested runtime and test files
        env:
          BRANCH: agent/48-critique-pilot-20260730
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/staging-event-store.mjs src/staging-service.mjs scripts/run-hosted-staging-acceptance.mjs test/hosted-staging-resume.test.mjs
          git diff --cached --check
          git commit -m "Resume hosted acceptance with bounded OIDC retries"
          git push origin "HEAD:${BRANCH}"
