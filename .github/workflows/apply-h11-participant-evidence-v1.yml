name: Apply H-11 integrated consent and debrief flow once

on:
  push:
    branches:
      - agent/48-critique-pilot-20260730
    paths:
      - ".github/apply_h11_participant_evidence_v1.py"
      - ".github/workflows/apply-h11-participant-evidence-v1.yml"

permissions:
  contents: write

concurrency:
  group: apply-h11-participant-evidence-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact pilot branch
        uses: actions/checkout@v4
        with:
          ref: agent/48-critique-pilot-20260730
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fail-closed participant-evidence patch
        env:
          GITHUB_REF_NAME: agent/48-critique-pilot-20260730
        run: python .github/apply_h11_participant_evidence_v1.py

      - name: Check diff and syntax
        run: |
          git diff --check
          node --check api/staging.mjs
          node --check src/staging-service.mjs
          node --check staging/app.mjs
          node --check scripts/verify-human-workflow-staging.mjs
          node --check test/human-workflow-staging-contract.test.mjs
          node --check e2e/human-workflow-staging.spec.mjs

      - name: Verify staging contracts
        run: npm run verify:staging

      - name: Run focused staging tests
        run: node --test test/human-workflow-staging-contract.test.mjs test/hosted-staging-gateway-contract.test.mjs

      - name: Run complete repository tests
        run: npm test

      - name: Build ordinary public release without staging shell
        run: |
          npm run build
          test ! -e dist/staging

      - name: Build explicit controlled-staging release
        run: |
          STAGING_BUILD=true npm run build
          test -f dist/staging/index.html
          test -f dist/staging/app.mjs
          test -f dist/staging/participant-readiness.css

      - name: Run synthetic lifecycle and support tabletop
        run: |
          npm run smoke:server
          npm run tabletop:staging

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run rendered Chromium workflow
        run: npx playwright test --config e2e/staging.playwright.config.mjs

      - name: Upload temporary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h11-integrated-consent-debrief-${{ github.sha }}
          path: .staging-evidence
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true

      - name: Commit validated product change and remove one-shot files
        run: |
          test ! -e .github/apply_h11_participant_evidence_v1.py
          test ! -e .github/workflows/apply-h11-participant-evidence-v1.yml
          git config user.name "ghuser29384"
          git config user.email "262476329+ghuser29384@users.noreply.github.com"
          git add api/staging.mjs \
            src/staging-service.mjs \
            staging/app.mjs \
            staging/participant-readiness.css \
            scripts/verify-human-workflow-staging.mjs \
            test/human-workflow-staging-contract.test.mjs \
            e2e/human-workflow-staging.spec.mjs \
            ops/next-steps-2026-07-23/h11-integrated-consent-debrief-flow-2026-08-07.md \
            .github
          git commit -m "Integrate H-11 consent and debrief evidence"
          git push origin HEAD:agent/48-critique-pilot-20260730
